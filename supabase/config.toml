project_id = "btsapp"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:4200"
additional_redirect_urls = []
enable_signup = false
minimum_password_length = 12

[auth.email]
# This toggles the email/password provider in local GoTrue. Global signup above
# stays disabled; seeded synthetic-email users still need password sign-in.
enable_signup = true
enable_confirmations = false

[auth.hook.send_email]
enabled = true
uri = "pg-functions://postgres/public/block_auth_email"

[realtime]
enabled = true
