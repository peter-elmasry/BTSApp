<div aria-live="polite" aria-atomic="true" class="fixed inset-x-4 bottom-24 z-50 mx-auto max-w-md">
  @if (toast.message()) {
    <div
      animate.enter="enter"
      class="flex items-center gap-3 rounded-card bg-navy p-4 text-white shadow-card"
    >
      <p class="flex-1">{{ toast.message() }}</p>
      <button
        class="min-h-11 min-w-11 rounded-lg"
        [attr.aria-label]="'common.dismiss' | transloco"
        (click)="toast.dismiss()"
      >
        ×
      </button>
    </div>
  }
</div>
