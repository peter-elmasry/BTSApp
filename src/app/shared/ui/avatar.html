<span
  class="inline-flex shrink-0 items-center justify-center overflow-hidden rounded-full border-4 bg-white"
  [style.border-color]="color()"
  [style.width.px]="size()"
  [style.height.px]="size()"
  ><img
    [src]="photo() || '/avatars/' + avatarKey() + '.svg'"
    [alt]="label()"
    [class]="photo() ? 'h-full w-full object-cover' : 'h-3/4 w-3/4'"
    (error)="imageFailed($event)"
    width="48"
    height="48"
/></span>
