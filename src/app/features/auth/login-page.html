<section *transloco="let t" class="mx-auto max-w-md space-y-5" dir="auto">
  <div class="rounded-card bg-navy p-6 text-white">
    <h1 class="text-2xl font-extrabold">{{ t('auth.login') }}</h1>
    <p class="mt-2 text-sm text-white/80">{{ t('auth.staffOnly') }}</p>
  </div>
  <form
    [formGroup]="form"
    (ngSubmit)="submit()"
    class="space-y-5 rounded-card bg-white p-5 shadow-card"
  >
    <ds-input formControlName="identifier" [label]="t('auth.identifier')" autocomplete="username" />
    <ds-input
      formControlName="password"
      [label]="t('auth.password')"
      type="password"
      autocomplete="current-password"
    />
    @if (error()) {
      <p role="alert" class="rounded-xl bg-gold-soft p-3 text-sm">{{ t('errors.' + error()) }}</p>
    }
    <ds-button type="submit" [fullWidth]="true" [loading]="busy()">{{ t('auth.login') }}</ds-button>
  </form>
</section>
