<div *transloco="let t" class="space-y-5">
  <header>
    <a routerLink="/ref" class="inline-flex min-h-11 items-center font-semibold text-teal"
      ><span aria-hidden="true" class="rtl:rotate-180">←</span>&nbsp;{{ t('nav.myStation') }}</a
    >
    <h1 class="text-2xl font-extrabold">{{ t('live.enterResult') }}</h1>
  </header>
  @if (reader.loading()) {
    <p role="status">{{ t('player.loading') }}</p>
  }
  @if (reader.error()) {
    <section class="space-y-3 rounded-card bg-white p-4">
      <p role="alert">{{ t(reader.error()) }}</p>
      <button class="ds-button secondary" (click)="reader.refresh()">
        {{ t('player.retry') }}
      </button>
    </section>
  }
  @if (reader.data(); as data) {
    @if (match(); as item) {
      <section class="rounded-card bg-white p-4 shadow-card">
        <app-live-match-summary [snapshot]="data" [match]="item" />
      </section>
      <app-result-entry [snapshot]="data" [match]="item" (saved)="saved($event)" />
      <section class="space-y-3">
        <button
          type="button"
          class="ds-button ghost w-full"
          data-testid="toggle-adjustments"
          [attr.aria-expanded]="showAdjustments()"
          aria-controls="match-adjustments"
          (click)="showAdjustments.set(!showAdjustments())"
        >
          {{ t('live.matchAdjustments') }}
          @if (adjustmentCount()) {
            ({{ adjustmentCount() }})
          }
        </button>
        @if (showAdjustments()) {
          <div id="match-adjustments" animate.enter="ds-pop">
            <app-adjustments-panel
              [snapshot]="data"
              [matchId]="item.id"
              (changed)="reader.refresh()"
            />
          </div>
        }
      </section>
    }
  }
</div>
