<section *transloco="let t" class="mx-auto max-w-md space-y-5">
  <div class="rounded-card bg-navy p-6 text-white">
    <h1 class="text-2xl font-extrabold">{{ t('profile.title') }}</h1>
    <p class="mt-2 text-sm text-white/80">{{ t('profile.hint') }}</p>
  </div>
  <form
    [formGroup]="form"
    (ngSubmit)="save()"
    class="space-y-5 rounded-card bg-white p-5 shadow-card"
    data-testid="profile-form"
  >
    <ds-input formControlName="full_name_en" [label]="t('profile.name')" autocomplete="name" />
    <ds-input
      formControlName="username"
      [label]="t('profile.username')"
      [hint]="t('profile.usernameHint')"
      autocomplete="username"
    />
    <ds-input
      formControlName="phone"
      type="tel"
      [label]="t('profile.phone')"
      [hint]="t('profile.phoneHint')"
      autocomplete="tel"
    />
    @if (error()) {
      <p role="alert" class="rounded-xl bg-gold-soft p-3 text-sm">{{ t('errors.' + error()) }}</p>
    }
    <ds-button type="submit" [fullWidth]="true" [loading]="busy()" [disabled]="form.pristine">{{
      t('profile.save')
    }}</ds-button>
  </form>
  <a
    routerLink="/account/password"
    class="inline-flex min-h-11 items-center font-semibold text-teal"
    >🔑 {{ t('account.changePassword') }}</a
  >
</section>
