<section *transloco="let t" class="mx-auto max-w-md space-y-5" dir="auto">
  <div class="rounded-card bg-navy p-6 text-white">
    <h1 class="text-2xl font-extrabold">{{ t('account.changePassword') }}</h1>
    <p class="mt-2 text-sm text-white/80">
      {{ t(forced() ? 'account.forcedHint' : 'account.hint') }}
    </p>
  </div>
  <form
    [formGroup]="form"
    (ngSubmit)="submit()"
    class="space-y-5 rounded-card bg-white p-5 shadow-card"
  >
    <ds-input
      formControlName="password"
      [label]="t('account.newPassword')"
      type="password"
      autocomplete="new-password"
    />
    <ds-input
      formControlName="confirm"
      [label]="t('account.confirmPassword')"
      type="password"
      autocomplete="new-password"
    />
    @if (error()) {
      <p role="alert" class="rounded-xl bg-gold-soft p-3 text-sm">{{ t('errors.' + error()) }}</p>
    }
    <ds-button type="submit" [fullWidth]="true" [loading]="busy()">{{
      t('account.save')
    }}</ds-button>
  </form>
</section>
