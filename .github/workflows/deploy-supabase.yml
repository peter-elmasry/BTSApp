name: Deploy Supabase
on:
  push:
    branches: [main, master]
    paths: ['supabase/**', '.github/workflows/deploy-supabase.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: supabase-production
  cancel-in-progress: false
jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check migration connection configuration
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Set the production environment secret SUPABASE_DB_URL to the Supabase Session pooler connection string (port 5432)."
            exit 1
          fi
      - run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Apply migrations through the IPv4 Session pooler
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npx supabase db push --db-url "$SUPABASE_DB_URL"
      # login/members functions are implemented in Phase 1.
      - name: Deploy existing Edge Functions
        shell: bash
        run: |
          for fn in login members; do
            if [ -f "supabase/functions/$fn/index.ts" ]; then npx supabase functions deploy "$fn"; fi
          done
