name: Supabase keepalive
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - run: curl --fail-with-body --silent --show-error --retry 2 "$SUPABASE_URL/rest/v1/rpc/server_now" -H "apikey:$SUPABASE_ANON_KEY" -H 'Content-Type:application/json' -d '{}'
